<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#12294d"/>
      <stop offset="1" stop-color="#1f6feb"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="240" fill="url(#fundo)"/>

  <g fill="#0d1117" fill-opacity="0.35">
    <path d="M0 175 q150 -40 300 0 t300 0 t300 0 t300 0 t300 0 t300 0 t300 0 t300 0 V240 H0 Z">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-600 0" dur="14s" repeatCount="indefinite"/>
    </path>
  </g>

  <g fill="#0d1117" fill-opacity="0.65">
    <path d="M-600 200 q150 -35 300 0 t300 0 t300 0 t300 0 t300 0 t300 0 t300 0 t300 0 V240 H-600 Z">
      <animateTransform attributeName="transform" type="translate" from="-600 0" to="0 0" dur="9s" repeatCount="indefinite"/>
    </path>
  </g>

  <text x="600" y="100" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="54" font-weight="600" fill="#e6edf3" opacity="0">
    [Seu nome]
    <animate attributeName="opacity" from="0" to="1" dur="1.6s" fill="freeze"/>
  </text>

  <text x="600" y="145" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#9fb3c8" opacity="0">
    Desenvolvedor de jogos 2D
    <animate attributeName="opacity" from="0" to="1" dur="1.6s" begin="0.8s" fill="freeze"/>
  </text>
</svg>
